[project]
name = "ComfyUI-MOSS-TTS-1.5"
description = "ComfyUI custom nodes for OpenMOSS MOSS-TTS v1.5 — both the Local-Transformer (48 kHz stereo) and the 8B full model (24 kHz mono). Reference-free TTS, zero-shot voice cloning, audio continuation, hard duration control, an encode-once token pipeline, 31 languages."
version = "0.6.7"
authors = [
  { name = "Enrico Ehrich" },
  { name = "Claude", email = "noreply@anthropic.com" },
]
license = { file = "LICENSE" }
dependencies = [
  # No pip deps on purpose: torch and torchaudio come with ComfyUI, and
  # transformers comes with this pack -- vendored, isolated from the shared
  # environment. On first load the pack pip-installs its own
  # transformers >= 5.5.1 (plus huggingface_hub, hf_xet) into ./vendor with
  # --no-deps --target, and swaps that copy into sys.modules only while a
  # MOSS node runs (vendor_context.py). The ComfyUI-wide transformers -- and
  # every other pack depending on it -- stays untouched; the Local-Transformer
  # still falls back to it (4.x works there) if the vendored install ever
  # fails. See the "Isolated transformers" section of the README.
]

[project.urls]
Repository = "https://github.com/eehrich/ComfyUI-MOSS-TTS-1.5"
Model = "https://huggingface.co/OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5"

[tool.comfy]
PublisherId = "enrico"
DisplayName = "MOSS-TTS 1.5"
Icon = "https://raw.githubusercontent.com/eehrich/ComfyUI-MOSS-TTS-1.5/main/assets/icon.png"
Models = []
